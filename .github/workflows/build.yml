name: Build Unsigned IPA

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: macos-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Select Latest Xcode
              run: sudo xcode-select -switch /Applications/Xcode.app

            - name: Build Xcode Archive
              run: |
                  xcodebuild archive \
                    -project LocalDevVPN.xcodeproj \
                    -scheme LocalDevVPN \
                    -destination 'generic/platform=iOS' \
                    -archivePath build/LocalDevVPN.xcarchive \
                    CODE_SIGN_IDENTITY="" \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGNING_ALLOWED=NO

            - name: Create Payload directory
              run: mkdir -p Payload

            - name: Copy App to Payload
              run: cp -R build/LocalDevVPN.xcarchive/Products/Applications/LocalDevVPN.app Payload/LocalDevVPN.app

            - name: Create IPA
              run: |
                  zip -r ./LocalDevVPN-unsigned.ipa Payload

            - name: Upload IPA Artifact
              uses: actions/upload-artifact@v7
              with:
                  path: LocalDevVPN-unsigned.ipa
                  archive: false
